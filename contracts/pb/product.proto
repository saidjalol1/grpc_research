syntax="proto3";
package product;

service ProductService {
    rpc GetProduct(ProductGetRequest) returns (Product);
    rpc CreateProduct(ProductCreateRequest) returns (Product);
    rpc DeleteProduct(ProductGetRequest) returns (Product);
    rpc UpdateProduct(Product) returns (Product);
    rpc SearchProducts(ProductSearchRequest) returns (ProductSearchResponse);
}

message ProductGetRequest {
    int32 id = 1;
}

message Product {
    int32 id = 1;
    string name = 2;
    string description = 3;
    float price = 4;
    float discount = 5;
}

message ProductCreateRequest {
    string name = 1;
    string description = 2;
    float price = 3;
    float discount = 4;
}

message ProductSearchRequest {
    string name = 1;
    float min_price = 2;
    float max_price = 3;
}

message ProductSearchResponse {
    repeated Product products = 1;
}